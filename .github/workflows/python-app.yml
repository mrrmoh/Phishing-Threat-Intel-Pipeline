name: Advanced Intel Pipeline

on:
  push:
    branches: [ "main" ]
  schedule:
    # Runs daily at 1am UTC = 2am WAT
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intel Scraper
        run: python scraper.py

      - name: Upload Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intel-feed
          path: |
            blocklist.txt
            ip-blocklist.txt
            intel-feed.json
          retention-days: 30
